services:
  shipping-confirm:
    build: .
    container_name: shipping-confirm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SQLITE_PATH=${SQLITE_PATH}
      - MSSQL_SERVER=${MSSQL_SERVER}
      - MSSQL_DATABASE=${MSSQL_DATABASE}
      - MSSQL_USER=${MSSQL_USER}
      - MSSQL_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_PORT=${MSSQL_PORT}
    volumes:
      - ${DATA_DIR}:/app/data
    extra_hosts:
      - "SUZVPRINT01:10.0.6.72"
    networks:
      - public-net

networks:
  public-net:
    external: true
