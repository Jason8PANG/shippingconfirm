<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#1e40af"/>
  <g transform="translate(256,256)">
    <!-- Box icon -->
    <rect x="-120" y="-80" width="240" height="200" rx="12" fill="none" stroke="#fff" stroke-width="20"/>
    <!-- Box lid -->
    <line x1="-120" y1="-20" x2="120" y2="-20" stroke="#fff" stroke-width="20"/>
    <!-- Tape on lid -->
    <line x1="0" y1="-80" x2="0" y2="-20" stroke="#fff" stroke-width="20"/>
    <!-- Check mark -->
    <polyline points="-60,40 -10,90 70,-10" fill="none" stroke="#34d399" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
